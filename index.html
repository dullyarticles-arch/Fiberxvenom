<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .loader-container {
      text-align: center;
    }

    .spinner {
      width: 45px;
      height: 45px;
      margin: 0 auto 15px;
      border: 4px solid #e5e5e5;
      border-top: 4px solid #000000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-size: 16px;
      color: #222;
      font-weight: 500;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

</body>
</html>
